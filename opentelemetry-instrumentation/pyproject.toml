[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentelemetry-instrumentation"
dynamic = ["version"]
description = "Instrumentation Tools & Auto Instrumentation for OpenTelemetry Python"
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "OpenTelemetry Authors", email = "cncf-opentelemetry-contributors@lists.cncf.io" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "opentelemetry-api ~= 1.4",
  "opentelemetry-semantic-conventions == 0.67b0.dev",
  "wrapt >= 1.0.0, < 3.0.0",
]

[project.scripts]
opentelemetry-bootstrap = "opentelemetry.instrumentation.bootstrap:run"
opentelemetry-instrument = "opentelemetry.instrumentation.auto_instrumentation:run"

[project.entry-points.opentelemetry_environment_variables]
instrumentation = "opentelemetry.instrumentation.environment_variables"

[project.urls]
Homepage = "https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/opentelemetry-instrumentation"
Repository = "https://github.com/open-telemetry/opentelemetry-python-contrib"

[tool.hatch.version]
path = "src/opentelemetry/instrumentation/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]

[tool.vendoring]
destination = "src/opentelemetry/instrumentation/_vendor/"
requirements = "vendor.txt"
namespace = "opentelemetry.instrumentation._vendor"
protected-files = ["__init__.py", "README.rst", "sbom.json", "vendor.txt"]
sbom-file = "src/opentelemetry/instrumentation/_vendor/sbom.json"

[tool.vendoring.transformations]
drop = [
  "packaging/dependency_groups.py",
  "packaging/direct_url.py",
  "packaging/errors.py",
  "packaging/licenses",
  "packaging/metadata.py",
  "packaging/pylock.py",
  "packaging/ranges.py",
  "packaging/_structures.py",
  "packaging-*.dist-info",
]
