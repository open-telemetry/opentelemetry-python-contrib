repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.1
    hooks:
      # Run the linter.
      - id: ruff
        args: ["--fix", "--show-fixes"]
      # Run the formatter.
      - id: ruff-format
      - id: ruff-format
        name: ruff-format (markdown & towncrier)
        types_or: [python, pyi, jupyter, markdown, text]
        files: \.(md|added|changed|deprecated|removed|fixed)$
        args: ["--preview"]
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 8ff2449591c8de025b17661ba76d60237a1ae62b # frozen: 0.12.1
    hooks:
      - id: uv-lock
        args: ["--index-url", "https://pypi.org/simple"]
  - repo: https://github.com/rstcheck/rstcheck
    rev: 77490ffa33bfc0928975ae3cf904219903db755d # frozen: v6.2.5
    hooks:
      - id: rstcheck
        additional_dependencies:
          - rstcheck[sphinx]
          - rstcheck-core==1.3.0
        args: ["--report-level", "warning"]
        exclude: ^_template/autodoc_entry\.rst$
