[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentelemetry-instrumentation-ibmmq"
dynamic = ["version"]
description = "OpenTelemetry IBM MQ instrumentation"
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "OpenTelemetry Authors", email = "cncf-opentelemetry-contributors@lists.cncf.io" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "opentelemetry-instrumentation == 0.66b0.dev",
  "opentelemetry-semantic-conventions == 0.66b0.dev",
  "opentelemetry-api ~= 1.5",
  "wrapt >= 1.0.0, < 3.0.0",
]

[project.optional-dependencies]
instruments = []
instruments-any = [
  "ibmmq >= 2.0, < 3.0",
  "pymqi >= 1.12, < 2.0",
]

[project.entry-points.opentelemetry_instrumentor]
ibmmq = "opentelemetry.instrumentation.ibmmq:IbmMqInstrumentor"

[project.urls]
Homepage = "https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-ibmmq"
Repository = "https://github.com/open-telemetry/opentelemetry-python-contrib"

[tool.hatch.version]
path = "src/opentelemetry/instrumentation/ibmmq/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]
