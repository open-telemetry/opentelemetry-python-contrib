[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentelemetry-agent"
dynamic = ["version"]
description = "OpenTelemetry Python Agent"
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "OpenTelemetry Authors", email = "cncf-opentelemetry-contributors@lists.cncf.io" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: OpenTelemetry",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
# The vendored opentelemetry-instrument: its sitecustomize hook imports the vendored auto-instrumentation.
opentelemetry-instrument = "opentelemetry.agent._vendor.opentelemetry.instrumentation.auto_instrumentation:run"

[project.urls]
Homepage = "https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/agent/opentelemetry-agent"
Repository = "https://github.com/open-telemetry/opentelemetry-python-contrib"

[tool.opentelemetry-vendor]
destination = "src/opentelemetry/agent/_vendor/"
requirements = "src/opentelemetry/agent/_vendor/requirements.txt"
namespace = "opentelemetry.agent._vendor"
python-version = "3.10"
protected-files = ["__init__.py", "README.rst", "requirements.txt"]
drop = [
  # Typing markers, tests and CLI entry points aren't used by the agent.
  "**/py.typed",
  "**/__main__.py",
  "certifi/tests",
  "charset_normalizer/cli",
  "idna/cli.py",
  # Debug-report helper (`python -m requests.help`); imports pyOpenSSL/cryptography.
  "requests/help.py",
  # Optional urllib3 integrations that would import the user's packages. Their imports are
  # guarded: SOCKS proxies raise InvalidSchema in requests (no PySocks), pyOpenSSL is only
  # used without SNI, emscripten only on Pyodide, and HTTP/2 (h2) only after an explicit
  # urllib3.http2.inject_into_urllib3().
  "urllib3/contrib/socks.py",
  "urllib3/contrib/pyopenssl.py",
  "urllib3/contrib/emscripten",
  "urllib3/http2/connection.py",
  # protobuf: benchmarks and test helpers (import google_benchmark/numpy/unittest_pb2) and the protoc
  # plugin API. google/protobuf/pyext is kept: its cpp_message.py wraps the vendored upb extension.
  "google/protobuf/internal/*_benchmark.py",
  "google/protobuf/internal/testing_refleaks.py",
  "google/protobuf/testdata",
  "google/protobuf/compiler",
  # gRPC service stubs (import grpcio, which isn't vendored: no pure-Python wheel).
  "google/longrunning/operations_pb2_grpc.py",
  "opentelemetry/proto/collector/**/*_pb2_grpc.py",
  # prometheus_client integrations with web frameworks the agent doesn't use (import the application's
  # aiohttp, Django and Twisted).
  "prometheus_client/aiohttp",
  "prometheus_client/django",
  "prometheus_client/twisted",
  # ruamel.yaml's libyaml binding wrappers and the build script of its optional C extension.
  "ruamel/yaml/cyaml.py",
  "ruamel/yaml/clibz",
]
# Applied in order after imports are rewritten; paths inside the patches are relative to destination.
patches = [
  "patches/requests-packages.patch",
  "patches/requests-chardet.patch",
  "patches/certifi-resources.patch",
  "patches/protobuf-implementation.patch",
  "patches/otel-importlib-metadata.patch",
  "patches/otel-sdk-vendored-names.patch",
  "patches/otel-distro-http-protocol.patch",
  "patches/otel-configuration-loader.patch",
  "patches/ruamel-yaml-pure.patch",
]
sbom-file = "src/opentelemetry/agent/_vendor/bom.cdx.json"
# Scoped METADATA and namespaced entry points for the vendored importlib.metadata lookups; see
# patches/otel-importlib-metadata.patch.
metadata-dir = "_metadata"

# These wheels declare Apache-2.0 but ship no license file; use the repository's (identical) Apache-2.0 text.
[tool.opentelemetry-vendor.license-files]
opentelemetry-configuration = "../../LICENSE"
opentelemetry-distro = "../../LICENSE"
opentelemetry-util-http = "../../LICENSE"

# Files whose findings from the vendored-code checks have been reviewed, per check.
[tool.opentelemetry-vendor.allow]
dynamic-imports = [
  # Only imports stdlib codec modules (encodings.*, _codecs_*).
  "charset_normalizer/cd.py",
  "charset_normalizer/utils.py",
  # Instrumentation imports (and wrapt patches) the application's libraries by module name: intended.
  "opentelemetry/instrumentation/utils.py",
  "wrapt/importer.py",
  "wrapt/patches.py",
  "wrapt/proxies.py",
  # Python-object tags of ruamel.yaml's unsafe constructors; the configuration loader uses SafeLoader.
  "ruamel/yaml/constructor.py",
  # YAML(plug_ins=...): the vendored tree has no plug-ins and the agent doesn't pass any.
  "ruamel/yaml/main.py",
]
side-effects = [
  # Warning filters only target the vendored packages' own warning classes (or, for the SDK's
  # TracerProvider, its own vendored module; see patches/otel-sdk-vendored-names.patch).
  "opentelemetry/sdk/_logs/_internal/__init__.py",
  "opentelemetry/sdk/trace/__init__.py",
  "requests/__init__.py",
  "ruamel/yaml/error.py",
  "urllib3/__init__.py",
  # set_environ() temporarily sets an environment variable and restores it.
  "requests/utils.py",
  # Configuring the process through OTEL_* environment variables (and PYTHONPATH for the
  # sitecustomize hook) is what the distro and opentelemetry-instrument are for.
  "opentelemetry/distro/__init__.py",
  "opentelemetry/instrumentation/auto_instrumentation/__init__.py",
  # Copies the deprecated prometheus_multiproc_dir variable to PROMETHEUS_MULTIPROC_DIR when set.
  "prometheus_client/multiprocess.py",
  "prometheus_client/values.py",
]
external-imports = [
  # Instrumentations import and patch the application's libraries: that's what they are for.
  "opentelemetry/instrumentation/*",
  # Optional, guarded imports of the application's packages:
  # - gRPC exporters from file configuration fail with a ConfigurationError (they aren't vendored);
  "opentelemetry/configuration/_logger_provider.py",
  "opentelemetry/configuration/_meter_provider.py",
  "opentelemetry/configuration/_tracer_provider.py",
  # - psutil for the process resource detector's process.* attributes;
  "opentelemetry/sdk/resources/__init__.py",
  # - numpy, only when the application converts a repeated field with numpy.asarray();
  "google/protobuf/internal/containers.py",
  # - snappy for Prometheus remote-write compression;
  "prometheus_client/exposition.py",
  # - cryptography (version warning), simplejson and _typeshed (type checking only);
  "requests/__init__.py",
  "requests/compat.py",
  "requests/cookies.py",
  # - ordereddict (Python 2 fallback) and configobj (configobj_walker(), unused);
  "ruamel/yaml/compat.py",
  "ruamel/yaml/util.py",
  # - brotli and zstandard content decoding.
  "urllib3/response.py",
  "urllib3/util/request.py",
]

# Native extensions, built from the sdist by `opentelemetry-vendor build-native` for platform wheels.
[tool.opentelemetry-vendor.native.protobuf]
# Builds google._upb._message as opentelemetry.agent._vendor.google._upb._message (abi3).
patches = ["patches/native/protobuf-upb.patch"]
build-requirements = "native-build-requirements.txt"

[tool.hatch.version]
path = "src/opentelemetry/agent/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]

# Tags the wheel cp310-abi3-<platform> when `opentelemetry-vendor build-native` built extensions
# into the vendor tree; otherwise it stays py3-none-any.
[tool.hatch.build.targets.wheel.hooks.custom]
abi3-tag = "cp310"
