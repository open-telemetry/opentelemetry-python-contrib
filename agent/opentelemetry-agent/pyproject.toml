[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentelemetry-agent"
dynamic = ["version"]
description = "OpenTelemetry Python Agent"
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "OpenTelemetry Authors", email = "cncf-opentelemetry-contributors@lists.cncf.io" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: OpenTelemetry",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/agent/opentelemetry-agent"
Repository = "https://github.com/open-telemetry/opentelemetry-python-contrib"

[tool.opentelemetry-vendor]
destination = "src/opentelemetry/agent/_vendor/"
requirements = "src/opentelemetry/agent/_vendor/requirements.txt"
namespace = "opentelemetry.agent._vendor"
python-version = "3.10"
protected-files = ["__init__.py", "README.rst", "requirements.txt"]
drop = [
  # Typing markers, tests and CLI entry points aren't used by the agent.
  "**/py.typed",
  "**/__main__.py",
  "certifi/tests",
  "charset_normalizer/cli",
  "idna/cli.py",
  # Debug-report helper (`python -m requests.help`); imports pyOpenSSL/cryptography.
  "requests/help.py",
  # Optional urllib3 integrations that would import the user's packages. Their imports are
  # guarded: SOCKS proxies raise InvalidSchema in requests (no PySocks), pyOpenSSL is only
  # used without SNI, emscripten only on Pyodide, and HTTP/2 (h2) only after an explicit
  # urllib3.http2.inject_into_urllib3().
  "urllib3/contrib/socks.py",
  "urllib3/contrib/pyopenssl.py",
  "urllib3/contrib/emscripten",
  "urllib3/http2/connection.py",
  # protobuf: benchmarks and test helpers (import google_benchmark/numpy/unittest_pb2), the protoc
  # plugin API, and the cpp implementation shim (unused: the pure-Python implementation is forced
  # by patches/protobuf-pure-python.patch).
  "google/protobuf/internal/*_benchmark.py",
  "google/protobuf/internal/testing_refleaks.py",
  "google/protobuf/testdata",
  "google/protobuf/compiler",
  "google/protobuf/pyext",
]
# Applied in order after imports are rewritten; paths inside the patches are relative to destination.
patches = [
  "patches/requests-packages.patch",
  "patches/requests-chardet.patch",
  "patches/certifi-resources.patch",
  "patches/protobuf-pure-python.patch",
]
sbom-file = "src/opentelemetry/agent/_vendor/bom.cdx.json"

# Files whose findings from the vendored-code checks have been reviewed, per check.
[tool.opentelemetry-vendor.allow]
dynamic-imports = [
  # Only imports stdlib codec modules (encodings.*, _codecs_*).
  "charset_normalizer/cd.py",
  "charset_normalizer/utils.py",
]
side-effects = [
  # Warning filters only target requests' and urllib3's own warning classes.
  "requests/__init__.py",
  "urllib3/__init__.py",
  # set_environ() temporarily sets an environment variable and restores it.
  "requests/utils.py",
]

[tool.hatch.version]
path = "src/opentelemetry/agent/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]
