[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentelemetry-agent"
dynamic = ["version"]
description = "OpenTelemetry Python Agent"
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "OpenTelemetry Authors", email = "cncf-opentelemetry-contributors@lists.cncf.io" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: OpenTelemetry",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/agent/opentelemetry-agent"
Repository = "https://github.com/open-telemetry/opentelemetry-python-contrib"

[tool.opentelemetry-vendor]
destination = "src/opentelemetry/agent/_vendor/"
requirements = "src/opentelemetry/agent/_vendor/requirements.txt"
namespace = "opentelemetry.agent._vendor"
protected-files = ["__init__.py", "README.rst", "requirements.txt"]
patches-dir = "patches"
sbom-file = "src/opentelemetry/agent/_vendor/bom.cdx.json"

[tool.hatch.version]
path = "src/opentelemetry/agent/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]
