[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentelemetry-vendor"
version = "0.0.0" # Not published to PyPI
description = "An internal CLI tool for vendoring packages for OpenTelemetry Python"
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "OpenTelemetry Authors", email = "cncf-opentelemetry-contributors@lists.cncf.io" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: OpenTelemetry",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Private :: Do Not Upload",
]
dependencies = [
    "cyclonedx-python-lib[json-validation] >= 11.0, < 12.0",
    "packageurl-python >= 0.11, < 1.0",
    "pip >= 25.0, < 27.0",
    "rich >= 13.0, < 16.0",
    "typer >= 0.15, < 1.0",
    "tomli >= 2.0, < 3.0; python_version < '3.11'",
]

[project.scripts]
opentelemetry-vendor = "opentelemetry.vendor.cli:main"

[project.urls]
Homepage = "https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/opentelemetry-vendor"
Repository = "https://github.com/open-telemetry/opentelemetry-python-contrib"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]
