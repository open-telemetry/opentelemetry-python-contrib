# Do not edit this file.
# This file is generated automatically by executing tox -e generate-workflows

name: CI

on:
  push:
    branches:
    - 'main'
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  misc:
    uses: ./.github/workflows/misc.yml # zizmor: ignore[self-repository] run the candidate's generated workflow
  lint:
    uses: ./.github/workflows/lint.yml # zizmor: ignore[self-repository] run the candidate's generated workflow
  test_0:
    name: tests
    uses: ./.github/workflows/test_0.yml # zizmor: ignore[self-repository] run the candidate's generated workflow
  test_1:
    name: tests
    uses: ./.github/workflows/test_1.yml # zizmor: ignore[self-repository] run the candidate's generated workflow
  test_2:
    name: tests
    uses: ./.github/workflows/test_2.yml # zizmor: ignore[self-repository] run the candidate's generated workflow

  check:
    if: always()
    needs:
      - misc
      - lint
      - test_0
      - test_1
      - test_2
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
